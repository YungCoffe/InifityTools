      <div class="h-2 bg-gradient-to-r from-red-500 via-red-600 to-red-700 absolute top-0 left-0 right-0"></div>

      <div class="flex items-center justify-between mb-6">

      <!-- Config Panel -->

          <input type="text" id="urlInput" class="w-full text-xs p-3 border border-stone-300 rounded-xl bg-white focus:outline-none focus:border-red-500 text-stone-700 font-mono" value="https://release-assets.githubusercontent.com/github-production-release-asset/386777925/f4cec701-55e8-44ab-8a25-66a4f15c81aa?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-11-05T17%3A50%3A40Z&rscd=attachment%3B+filename%3Daliucord-manager-v1.3.0.apk&rsct=application%2Fvnd.android.package-archive&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-11-05T16%3A49%3A54Z&ske=2026-11-05T17%3A50%3A40Z&sks=b&skv=2018-11-09&sig=GVyzac9%2BevuGABjsfg3lc9HPEvhxSD50gajSih8Ge5M%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5Mzg5Nzc2MywibmJmIjoxNzkzODk3NDYzLCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVduct... (Link Cortado pra Visualizar)">
        </div>
        <div>
          <label class="block text-xs font-bold text-stone-600 uppercase tracking-wider mb-1">Link de Backup (Release Page)</label>
          <input type="text" id="backupUrlInput" class="w-full text-xs p-3 border border-stone-300 rounded-xl bg-white focus:outline-none focus:border-red-500 text-stone-700 font-mono" value="https://github.com/Aliucord/Manager/releases/tag/v1.3.0">
        </div>
        <button onclick="updateUrls()" class="w-full py-2 bg-stone-900 text-white text-xs font-semibold rounded-xl hover:bg-black transition">Salvar Alterações</button>
      </div>

      <div class="space-y-3">
        <button onclick="iniciarDownload()" class="btn-red-pulse w-full py-4 bg-red-600 hover:bg-red-700 text-white font-bold rounded-2xl flex items-center justify-center gap-3 transition shadow-lg shadow-red-200 cursor-pointer">
          <i class="fa-solid fa-download text-lg"></i>
          <span id="btnText">Baixar APK Agora</span>
        </button>

        <a id="backupBtn" href="https://github.com/Aliucord/Manager/releases/tag/v1.3.0" target="_blank" class="w-full py-3 bg-stone-100 hover:bg-stone-200 text-stone-700 font-semibold rounded-2xl flex items-center justify-center gap-2 text-sm transition">
          <i class="fa-brands fa-github"></i>
          <span>Abrir Página de Releases (GitHub)</span>
        </a>
      </div>
    </div>
  </main>

  <footer class="py-6 text-center text-xs text-stone-400 border-t border-stone-200">
    <p>© 2026 Infinity Tools. Todos os direitos reservados.</p>
  </footer>

  <script>
    let directUrl = "https://release-assets.githubusercontent.com/github-production-release-asset/386777925/f4cec701-55e8-44ab-8a25-66a4f15c81aa?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-11-05T17%3A50%3A40Z&rscd=attachment%3B+filename%3Daliucord-manager-v1.3.0.apk&rsct=application%2Fvnd.android.package-archive&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-11-05T16%3A49%3A54Z&ske=2026-11-05T17%3A50%3A40Z&sks=b&skv=2018-11-09&sig=GVyzac9%2BevuGABjsfg3lc9HPEvhxSD50gajSih8Ge5M%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5Mzg5Nzc2MywibmJmIjoxNzkzODk3NDYzLCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.bA6ZOM_aUwOUYRUKoQPUdOoqpFHu8r_rV7tScZ47HVU&response-content-disposition=attachment%3B%20filename%3Daliucord-manager-v1.3.0.apk&response-content-type=application%2Fvnd.android.package-archive";
    let backupUrl = "https://github.com/Aliucord/Manager/releases/tag/v1.3.0";

    function toggleConfig() {
      document.getElementById('configPanel').classList.toggle('hidden');
    }

    function updateUrls() {
      directUrl = document.getElementById('urlInput').value;
      backupUrl = document.getElementById('backupUrlInput').value;
      document.getElementById('backupBtn').href = backupUrl;
      alert('Links atualizados com sucesso!');
      toggleConfig();
    }

    function iniciarDownload() {
      const btnText = document.getElementById('btnText');
      btnText.innerText = "Iniciando...";

      // Tenta abrir o link direto
      const win = window.open(directUrl, '_blank');

      // Caso o navegador bloqueie popup ou a URL direta dê erro/expire
      setTimeout(() => {
        btnText.innerText = "Baixar APK Agora";
      }, 3000);
    }
  </script>
</body>
</html>
